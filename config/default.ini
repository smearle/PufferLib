[base]
env_name = None

# Multi-GPU (single GPU defaults)
gpu_offset = 0

profile = 0
checkpoint_dir = checkpoints
log_dir = logs
checkpoint_interval = 500
eval_episodes = 10000
eval_agents = -1
load_model_path = 'None'
load_enemy_model_path = 'None'
run_id = 'None'
result_fd = 0

# CUDA graphs (first real rollout/train use). >=0 enable, -1 disable.
cudagraphs = 1
seed = 73
# If true, zero RNN state every horizon (ablation). If false (default carry),
# state persists across horizons and resets only on terminal.
reset_every_horizon = 0

# Cleanba-style learner/actor pipelining: rollouts use a one-epoch-stale actor
# snapshot while the learner trains the previous horizon. Works with carry
# (reset_every_horizon=0) via per-slot initial_states.
async = 1

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 8
# Total policies including trainable policies[0]. 1 = train only.
num_policies = 1
# Required > 0 when num_policies > 1 (historical opponent arch).
hist_policy_hidden_size = 0
hist_policy_num_layers = 0
# Fraction of envs (0–1) assigned to historical policies when num_policies > 1.
hist_policy_percent = 0

# Selfplay-pool training. When enabled, hist_policy_percent of agent slots (see
# [vec]) play against older checkpoints from the current run. Opponents are
# resampled from the pool every opp_timeout_steps global steps (0 = never).
# At end of train, final policy scoring (first match wins):
#   eval_bot_games > 0 → mean env/perf vs the eval_bots ladder (1 Protein point)
#   else eval_games > 0 → mean A winrate vs up to eval_pool_size pool opps
[selfplay]
enabled = 0
max_size = 16
seed = 42
# Resample each historical opponent after this many global steps. 0 = never.
opp_timeout_steps = 500_000_000
eval_pool_size = 8
eval_games = 0
# 0 = off. >0 = after train, eval final vs each bot in eval_bots for this many
# episodes each; mean env/perf becomes TrainResult.score (points=1 for Protein).
eval_bot_games = 0
# Ladder rungs, weakest first: the [env] bot_policy ids the env's header
# defines. Required when eval_bot_games > 0, e.g. eval_bots = 3,4,5,6.
eval_bots = 0
eval_bot_envs = 8192
eval_bot_threads = 0

# Per-rung [env] overrides for the bot ladder, as full section.key = value
# lines (e.g. env.dr = 0). Env-owned so core needs no per-env knowledge.
[bot_eval]

# Args used by your env's binding.c go here
[env]
dr = 0
num_agents = 1
num_bots = 0
# Salt for T2 paired-episode world seeds (envs that define PUF_T2_PAIRED).
t2_seed = 0

# Intrinsic rewards (--t2 build). method selects T2 or a paper-faithful
# baseline; the bonus lands on the rollout row PufferLib credits to the
# action, scaled by the method's coef, then passes the [-1, 1] reward clamp.
[intrinsic]
method = none
# Replace the env reward with the intrinsic reward instead of adding to it.
intrinsic_only = 0
# Baseline feature learner: inverse-dynamics features (e3b, icm) and RND
# nets share the env's encoder architecture as a separate instance.
feature_dim = 256
hidden_dim = 256
layernorm = 1
# Transitions per optimizer step (8 lanes x 80 unroll as in TorchBeast) and
# steps per train epoch (0 = one pass over the epoch's transitions).
batch_rows = 640
steps_per_epoch = 0
# Exclude transitions into a reset observation from inverse/forward losses.
mask_resets = 1
max_grad_norm = 40.0

[e3b]
coef = 1.0
ridge = 0.1
# torchbeast = released running-std quirk (8-lane learner batches), running, none
normalize = torchbeast
optimizer = adam
learning_rate = 0.0001
adam_beta1 = 0.9
adam_beta2 = 0.999
eps = 0.01
rmsprop_alpha = 0.99

[icm]
coef = 0.1
forward_coef = 1.0
inverse_coef = 0.1
normalize = none
optimizer = rmsprop
learning_rate = 0.0001
adam_beta1 = 0.9
adam_beta2 = 0.999
eps = 0.01
rmsprop_alpha = 0.99

[rnd]
coef = 0.001
output_dim = 512
normalize = none
optimizer = rmsprop
learning_rate = 0.0001
adam_beta1 = 0.9
adam_beta2 = 0.999
eps = 0.01
rmsprop_alpha = 0.99

# T2: peer-channel Double Take intrinsic reward from a world model trained on
# paired episodes (--t2 build). Rewards are clip(scale*(q_ctrl-q1) bits, 0,
# scale*cap) per transition, computed online during rollouts under the
# world-model weights frozen for that rollout.
[t2]
enabled = 0
# Replace the env reward with the intrinsic reward instead of adding to it.
intrinsic_only = 1
reward_scale = 0.1
reward_cap = 8.0
# World model: token embedding width, recurrent hidden size and layers, head width.
embed_dim = 64
hidden_size = 128
num_layers = 1
head_dim = 128
# GPU episode-prefix capacity used for replay training. Longer active scoring
# histories retain raw suffixes on the CPU and re-encode in bounded GPU chunks.
max_episode = 1024
# Complete paired episodes kept for world-model training (pair slots = half).
reservoir = 512
# Training: rows per optimizer step, steps per train epoch, truncated BPTT window.
wm_batch = 1024
wm_steps = 32
bptt_window = 64
learning_rate = 0.0003
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
max_grad_norm = 1.0
# Re-encode lane and reservoir states under the updated weights after each
# training epoch, so stored prefixes stay literal (costs one pass over records).
reencode = 1
# Probability that a training row uses the partner trial (peer) as support
# when its partner episode is resident; the rest use the causal self prefix.
peer_prob = 0.5

[policy]
hidden_size = 128
num_layers = 4

[train]
gpus = 1
total_timesteps = 10_000_000
learning_rate = 0.015
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.001
# Cosine-anneal ent_coef like lr does. Off by default (matches old behavior).
# When on: ent_coef decays from its base value to min_ent_coef_ratio * ent_coef
# over total_timesteps. Useful late in training to let a learned policy commit
# harder on its preferences once the entropy bonus is no longer load-bearing.
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.95
minibatch_size = 8192
horizon = 64
# vtrace=0: GAE with ρ=1. vtrace=1: puff_advantage clips ρ/c.
vtrace = 0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0

# Verb-eps exploration floor (experimental, Nethack; see src/algo.cu). 0 = off.
verb_eps = 0.0
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0

[sweep]
metric = score 
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
max_runs = 1200
gpus = -1
downsample = 5
prune_pareto = 1
early_stop_quantile = 0.3

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 1e11
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 16384
scale = auto

#[sweep.vec.num_buffers]
#distribution = uniform
#min = 1
#max = 8
#scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 512
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 65536
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 1.0
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.1
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.2
max = 0.995
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 4.0
scale = auto

# Lower clip is sometimes better but less stable
[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 0.9
scale = auto

# Optimal vf clip can be lower than 0.1,
# but this results in jank unstable runs
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 4.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 1.5
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto
